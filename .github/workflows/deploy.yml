name: Deploy Backend

# Builds the Go binary, scp's it (with the migrations it was built against)
# to a fresh release directory on the VPS, then repoints the `current`
# symlink and restarts the systemd --user service. Pushing to `main` deploys
# production; `staging` deploys the staging instance. Per-environment
# secrets live in GitHub Environments (production / staging).
#
# Each releases/<sha>/ bundles the binary with the db/ migrations it expects,
# so a rollback (repointing the symlink) can never pair a binary with the
# wrong migration set. The app applies migrations on startup, so code and
# schema can never arrive out of step within a release either.
on:
  push:
    branches: [main, staging]
    paths:
      - "cmd/**"
      - "internal/**"
      - "db/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "deploy/portfolio-backend@.service"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never let two deploys of the same branch overlap on the box.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build binary
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: test` - the build shares no artifact with the
    # test job, so running them in parallel halves deploy wall-clock. The
    # gate that matters is on `deploy`, which needs both.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Same flags the app has always shipped with, via the Makefile as
      # single source of truth. CGO disabled + GOOS=linux regardless of the
      # runner - this always targets the VPS, not the CI host.
      - name: Build
        run: make build

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            bin/portfolio-backend
            db/
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Resolve deployment environment
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release

      # New, self-contained directory per deploy - nothing on the box is
      # overwritten until the symlink swap below, so a failed scp never
      # leaves a half-written release live.
      - name: Copy release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "release/portfolio-backend,release/db"
          target: ${{ vars.APP_PATH }}/${{ steps.vars.outputs.env }}/releases/${{ github.sha }}/
          strip_components: 1

      # One SSH session: write .env, activate the release, restart, verify,
      # prune old releases.
      - name: Deploy release
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ENV: ${{ steps.vars.outputs.env }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_ENV,RELEASE_SHA
          script: |
            set -euo pipefail
            target="${{ vars.APP_PATH }}/$DEPLOY_ENV"
            cd "$target"

            chmod +x "releases/$RELEASE_SHA/portfolio-backend"

            # BACKEND_ENV is the app's whole .env. The quoted heredoc terminator
            # stops the shell expanding anything inside the secret.
            umask 077
            cat > .env <<'ENVFILE'
            ${{ secrets.BACKEND_ENV }}
            ENVFILE
            echo "DEPLOY_ENV=$DEPLOY_ENV" >> .env
            chmod 600 .env

            ln -sfn "releases/$RELEASE_SHA" current
            systemctl --user restart "portfolio-backend@$DEPLOY_ENV"

            # Same probe the deploy has always waited on - a container/process
            # that starts but never serves fails the deploy instead of passing
            # silently.
            port="$(grep -oP '^PORT=\K.*' .env || echo 8081)"
            ok=""
            for _ in $(seq 1 15); do
              if curl -fsS "http://127.0.0.1:$port/portfolio/v1/cron" >/dev/null; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "portfolio-backend@$DEPLOY_ENV did not become healthy" >&2
              systemctl --user status "portfolio-backend@$DEPLOY_ENV" --no-pager || true
              exit 1
            fi

            systemctl --user status "portfolio-backend@$DEPLOY_ENV" --no-pager

            # Reclaim disk from superseded releases; without this the VPS fills
            # up after a few dozen deploys.
            ls -1t releases | tail -n +6 | while read -r old; do
              rm -rf "releases/$old"
            done
