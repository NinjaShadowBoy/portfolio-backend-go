name: Deploy Backend

# Vets and tests, builds the image, pushes it to GHCR, then runs the Ansible
# deploy playbook from the infra repo against the VPS. Pushing to `main`
# deploys production; `staging` deploys the staging instance.
#
# Every image is tagged with the commit SHA and the playbook is told that
# exact tag, so a rollback is re-running the workflow (or the playbook by
# hand) with an older SHA. Migrations ship inside the image next to the
# binary they were written for, and the app applies them on startup.
on:
  push:
    branches: [main, staging]
    paths:
      - "cmd/**"
      - "internal/**"
      - "db/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never let two deploys of the same branch overlap on the box.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/portfolio-backend-go

jobs:
  test:
    name: Vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    # Runs in parallel with `test`; `deploy` is the gate that needs both.
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Compute image tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags per build: the immutable SHA tag the deploy pins, and a
      # moving branch tag for humans browsing the registry.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      # The Ansible project lives in the infra repo; INFRA_REPO is a repo
      # variable like "NinjaShadowBoy/vps-infra". INFRA_REPO_TOKEN is
      # only needed if that repo is private.
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          pip install --quiet ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Configure SSH and vault
        run: |
          umask 077
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ~/.vault_pass

      - name: Run deploy playbook
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: ~/.vault_pass
        run: |
          ansible-playbook deploy.yml \
            -i inventory/hosts.yml \
            --private-key ~/.ssh/deploy_key \
            -e "ansible_host=${{ secrets.VPS_HOST }}" \
            -e "ansible_user=${{ secrets.VPS_USER }}" \
            -e "target_env=${{ env.DEPLOY_ENV }}" \
            -e "app=backend" \
            -e "backend_image_tag=${{ needs.build.outputs.tag }}"
