name: Deploy Backend

# Builds a static binary, tests it, ships it to the VPS over SSH/rsync and
# restarts the systemd service. Pushing to `main` deploys production; `staging`
# deploys the staging instance. Per-environment secrets live in GitHub
# Environments (production / staging).
on:
  push:
    branches: [main, staging]
    paths:
      - "cmd/**"
      - "internal/**"
      - "db/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never let two deploys of the same branch overlap on the box.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # go-version-file keeps CI in lockstep with go.mod (currently 1.26) so the
      # build can't silently use an older toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Same build flags as `make docker` / the Dockerfile -  kept in the Makefile
      # as the single source of truth for the build command.
      - name: Build binary
        run: make build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: bin/portfolio-backend
          retention-days: 3

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: bin/

      # Only the environment name is derived in CI. The bound port is NOT
      # duplicated here -  it is read back from the deployed .env (its single
      # source of truth) during the health check below.
      - name: Resolve deployment environment
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Make binary executable
        run: chmod +x bin/portfolio-backend

      # Ship the binary and migrations. --exclude '.env' protects the server-side
      # secrets file from --delete; migrations are applied by the app on startup.
      - name: Sync artifacts to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.env'
          path: bin/portfolio-backend db/
          remote_path: ${{ vars.APP_PATH }}/${{ steps.vars.outputs.env }}/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      # One SSH session: render the .env from the environment secret, restart the
      # service, then confirm it serves before calling the deploy green. The
      # quoted heredoc prevents any expansion inside the secret.
      - name: Provision env, restart & health check
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ENV: ${{ steps.vars.outputs.env }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_ENV
          script: |
            set -euo pipefail
            target="${{ vars.APP_PATH }}/$DEPLOY_ENV"

            install -d -m 700 "$target"
            umask 077
            cat > "$target/.env" <<'ENVFILE'
            ${{ secrets.BACKEND_ENV }}
            ENVFILE
            chmod 600 "$target/.env"

            svc="portfolio-backend@$DEPLOY_ENV"
            sudo systemctl restart "$svc"

            # Health-check port comes from the .env we just wrote (single source of
            # truth), defaulting to 8080 to match the app default.
            port="$(grep -E '^PORT=' "$target/.env" | tail -n1 | grep -oE '[0-9]+' | head -n1)"
            port="${port:-8080}"

            # Poll the cron route (200, no auth) for up to ~30s.
            for i in $(seq 1 15); do
              if curl -fsS "http://127.0.0.1:$port/portfolio/v1/cron" >/dev/null; then
                echo "healthy after $((i * 2))s on port $port"
                sudo systemctl is-active "$svc"
                exit 0
              fi
              sleep 2
            done

            echo "::error::$svc failed health check on port $port"
            sudo systemctl status "$svc" --no-pager -l | tail -n 40 || true
            exit 1
