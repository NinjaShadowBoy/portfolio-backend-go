name: Deploy Backend

# Builds a container image, pushes it to GHCR, then tells the VPS to pull it and
# roll the compose stack. Pushing to `main` deploys production; `staging`
# deploys the staging instance. Per-environment secrets live in GitHub
# Environments (production / staging).
#
# The image is the deploy artifact - there is no rsync of binaries or migrations
# any more. Migrations ship inside the image (COPY db) and the app applies them
# on startup, so code and schema can never arrive out of step.
on:
  push:
    branches: [main, staging]
    paths:
      - "cmd/**"
      - "internal/**"
      - "db/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "deploy/docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never let two deploys of the same branch overlap on the box.
concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: test` - the image build shares no artifact with
    # the test job, so running them in parallel halves deploy wall-clock. The
    # gate that matters is on `deploy`, which needs both.
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase path segments, and the owner here is mixed-case.
      - name: Resolve image reference
        id: meta
        run: |
          repo_lc="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Immutable SHA tag only. A moving `:latest` would let the VPS pull a
          # different image than the one this run built.
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment environment
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      # The compose file is the only thing copied up now. It is versioned with
      # the code, so the stack definition cannot drift from what CI expects.
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: ${{ vars.APP_PATH }}/${{ steps.vars.outputs.env }}/
          strip_components: 1

      # One SSH session: render .env, log in to GHCR, pull, roll, verify.
      # `--wait` blocks on the compose healthchecks, so a container that starts
      # but never becomes healthy fails the deploy instead of passing silently.
      - name: Deploy stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ENV: ${{ steps.vars.outputs.env }}
          API_IMAGE: ${{ needs.build.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_ENV,API_IMAGE,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -euo pipefail
            target="${{ vars.APP_PATH }}/$DEPLOY_ENV"
            install -d -m 700 "$target"
            cd "$target"

            # BACKEND_ENV is the app's whole .env. The quoted heredoc terminator
            # stops the shell expanding anything inside the secret.
            umask 077
            cat > .env <<'ENVFILE'
            ${{ secrets.BACKEND_ENV }}
            ENVFILE

            # Values compose interpolates (as opposed to values the app reads)
            # are appended here so the deploy pins its own image tag.
            {
              echo "DEPLOY_ENV=$DEPLOY_ENV"
              echo "API_IMAGE=$API_IMAGE"
            } >> .env
            chmod 600 .env

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            docker compose pull
            docker compose up -d --wait --remove-orphans

            docker compose ps
            # Reclaim disk from superseded images; without this the VPS fills up
            # after a few dozen deploys.
            docker image prune -f --filter "until=168h"
