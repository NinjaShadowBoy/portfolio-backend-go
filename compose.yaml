# Local development stack.
#
#   docker compose up            Postgres, the API (built from this repo),
#                                SigNoz, and an uptime probe
#   docker compose watch         same, and rebuild the API when Go files change
#   docker compose up db         only Postgres, for `go run ./cmd/api` on the host
#
# SigNoz UI: http://localhost:8080 (create the admin account on first visit).
# API:       http://localhost:8081/portfolio/v1
# Postgres:  localhost:5432, user/password/db all `portfolio`
#
# The SigNoz part is generated by SigNoz's Foundry CLI into
# deploy/local/signoz/ (`make signoz-forge` regenerates it). It needs about
# 3 GB of RAM; give Docker Desktop at least 5 GB.
name: portfolio-dev

include:
  - path: deploy/local/signoz/compose.yaml

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    # POSTGRES_PORT (in .env or the shell) moves the host port when a native
    # Postgres already owns 5432; DB_URL in .env must then use the same port.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      args:
        VERSION: dev
    restart: unless-stopped
    # .env supplies OAuth, SMTP and any personal overrides; the values below
    # win over it because they must match the other containers.
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: local
      BIND_ADDR: 0.0.0.0
      PORT: "8081"
      DB_URL: postgres://portfolio:portfolio@db:5432/portfolio?sslmode=disable
      # Compose reads .env for ${...} too, so a real JWT_SECRET there is used.
      # The fallback is for a fresh checkout only and never leaves this file.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-0123456789abcdef}
      OAUTH_BASE_URL: http://localhost:8081/portfolio/v1
      OTEL_SERVICE_NAME: portfolio-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-ingester:4318
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - signoz-network
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - bin/
            - deploy/
            - docs/
            - "*.md"

  # Probes the API the way the VPS is probed in production; see
  # deploy/local/uptime-collector.yaml.
  uptime:
    image: otel/opentelemetry-collector-contrib:0.160.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/local/uptime-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - backend
    networks:
      - default
      - signoz-network

volumes:
  pgdata:
